<div class="site-card" data-category="${category}">
  <div class="site-card-header">
    <div class="site-avatar ${avatar}">${icon}</div>
    <div class="site-meta">
      <div class="site-name">${name}</div>
      <div class="site-url">${url}</div>
    </div>
  </div>
  <p class="site-desc">${description}</p>
  <div class="site-footer">
    <span class="site-tag tag-dcategory">${category}</span>
    <span class="site-members">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      ${members}
    </span>
    <a href="#" class="site-cta" target="_blank" rel="noopener">Join site</a>
  </div>
</div>
