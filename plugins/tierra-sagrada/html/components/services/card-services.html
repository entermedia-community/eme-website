<div class="site-card" data-category="${category}">
  <div class="site-card-header">
    <div class="site-avatar ${avatar}">${icon}</div>
    <div class="site-meta">
      <div class="site-name">${name}</div>
      <div class="site-url">${url}</div>
    </div>
  </div>
  <p class="site-desc">${description}</p>
  <div class="site-footer">
    <span class="site-tag tag-dcategory">${category}</span> 
    <a href="#" class="site-cta" target="_blank" rel="noopener">Open</a>
  </div>
</div>
