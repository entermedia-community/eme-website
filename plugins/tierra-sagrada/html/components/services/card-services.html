<div class="services-card" data-category="${category}">
  <div class="services-card-header">
    <div class="services-avatar ${avatar}">${icon}</div>
    <div class="services-meta">
      <div class="services-name">${product.name}</div>
      <div class="services-url">${product.url}</div>
    </div>
  </div>
  <p class="services-desc">${product.longcaption}</p>
  <div class="services-footer">
    <span class="services-tag tag-dcategory">${product.productprice}/${product.recurringperiod}</span> 
    <a href="#" class="services-cta" target="_blank" rel="noopener">
      <span role="img" aria-label="Explore">💬</span> [[Explore]]
    </a>
  </div>
</div>
